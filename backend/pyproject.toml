[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "realityos-backend"
version = "0.1.0"
description = "RealityOS spatial-memory API and processing contracts"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "anyio>=4.4,<4.10",
  "celery>=5.4,<6",
  "fastapi>=0.115,<0.116",
  "httpx>=0.28,<1",
  "meta-sam-parser>=0.1,<0.2",
  "Pillow>=11,<12",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<6",
  "SQLAlchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
