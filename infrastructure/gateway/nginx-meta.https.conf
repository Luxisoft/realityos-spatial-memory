limit_req_zone $binary_remote_addr zone=realityos_meta_gateway:10m rate=30r/m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __META_GATEWAY_HOSTNAME__;

    ssl_certificate /etc/letsencrypt/live/__META_GATEWAY_HOSTNAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__META_GATEWAY_HOSTNAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:RealityOSMetaTLS:10m;

    location / {
        include /etc/nginx/snippets/realityos-meta-allowlist.conf;
        limit_req zone=realityos_meta_gateway burst=20 nodelay;
        proxy_pass http://127.0.0.1:__META_GATEWAY_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        client_max_body_size 32m;
    }
}
