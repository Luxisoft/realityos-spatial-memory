server {
    listen 80;
    listen [::]:80;
    server_name __META_GATEWAY_HOSTNAME__;

    # This include contains only Cloudflare's published CIDR ranges. It lets
    # the allowlist evaluate the original backend address, not a proxy edge.
    include /etc/nginx/snippets/realityos-meta-cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/realityos-meta-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
