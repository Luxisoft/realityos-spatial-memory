limit_req_zone $binary_remote_addr zone=local_login:1m rate=10r/m;
server {
  listen 80;
  server_name _;
  client_max_body_size 0;
  proxy_read_timeout 900s;
  proxy_send_timeout 900s;
  # Preserve localhost's explicit port in generated evidence and media URLs.
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  location = /v1/auth/local-login {
    limit_req zone=local_login burst=4 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
  }
  location /v1/ { proxy_pass http://api:8000; }
  location /health/ { proxy_pass http://api:8000; }
  location /display/ { proxy_pass http://display:80/; }
  location / { proxy_pass http://frontend:80; }
}
