server {
  listen 80;
  server_name _;
  # RealityOS validates authorization and MIME server-side. Do not impose a
  # proxy-only size cap that prevents a PostgreSQL BYTEA-backed video upload.
  client_max_body_size 0;
  proxy_read_timeout 900s;
  proxy_send_timeout 900s;

  location /v1/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health/ {
    proxy_pass http://api:8000;
  }

  # API documentation remains available after retiring the browser app.
  location = /docs { proxy_pass http://api:8000; }
  location = /docs/oauth2-redirect { proxy_pass http://api:8000; }

  location = /display { return 410; }
  location /display/ { return 410; }

  location / { return 410; }
}
