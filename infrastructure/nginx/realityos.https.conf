# This file is installed under nginx's http{} context, so the rate-limit zone
# is shared by the one public virtual-device enrollment location below.
limit_req_zone $binary_remote_addr zone=realityos_virtual_bootstrap:10m rate=6r/m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __REALITYOS_HOSTNAME__;

    ssl_certificate /etc/letsencrypt/live/__REALITYOS_HOSTNAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__REALITYOS_HOSTNAME__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/realityos-cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    client_max_body_size 0;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /v1/virtual-devices/bootstrap {
        limit_req zone=realityos_virtual_bootstrap burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:__REALITYOS_PROXY_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:__REALITYOS_PROXY_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
