# Merge with infrastructure/gateway/docker-compose.yml on FRONTEND only.
# Enable only after the memory/latency preflight documented in docs/TTS.md.
services:
  seamless-tts:
    image: ${REALITYOS_TTS_IMAGE:?Set an immutable Seamless image}
    env_file: ${TTS_ENV_FILE:-./tts.env}
    environment:
      HF_HOME: /models
      TTS_CPU_THREADS: "2"
    volumes:
      - seamless_models:/models
    mem_limit: 8g
    cpus: 2
    pids_limit: 128
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8091/health/ready')"]
      interval: 15s
      timeout: 5s
      start_period: 600s
      retries: 6
  meta-gateway:
    environment:
      TTS_SERVICE_URL: http://seamless-tts:8091/synthesize
    env_file:
      - ${META_GATEWAY_ENV_FILE:-./runtime.env}
      - ${TTS_ENV_FILE:-./tts.env}
volumes:
  seamless_models:
