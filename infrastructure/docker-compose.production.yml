services:
  api:
    image: ${REALITYOS_BACKEND_IMAGE:?Set REALITYOS_BACKEND_IMAGE to an immutable GHCR tag}
    pull_policy: always
    environment:
      META_MODE: live
      VIRTUAL_DEVICE_BOOTSTRAP_ENABLED: ${VIRTUAL_DEVICE_BOOTSTRAP_ENABLED:-false}
      VIRTUAL_DEVICE_WORKSPACE_NAME: ${VIRTUAL_DEVICE_WORKSPACE_NAME:-Taller de electrónica}
      VIRTUAL_DEVICE_BASE_URL: ${VIRTUAL_DEVICE_BASE_URL:-https://realityos.luxisoft.com/v1}
      VIRTUAL_DEVICE_TTL_MINUTES: ${VIRTUAL_DEVICE_TTL_MINUTES:-1440}
  worker:
    image: ${REALITYOS_BACKEND_IMAGE:?Set REALITYOS_BACKEND_IMAGE to an immutable GHCR tag}
    pull_policy: always
    environment:
      META_MODE: live
