# Primary local installation. Never combine with historical production Compose files.
name: realityos-local
x-backend: &backend
  image: realityos-local-backend:dev
  build:
    context: ..
    dockerfile: backend/Dockerfile
  env_file: ../.env.local
  environment:
    ENVIRONMENT: local
    LOCAL_LOGIN_ENABLED: "true"
    LOCAL_EVALUATION_ENABLED: "true"
    META_CONNECTION_MODE: direct
    META_GATEWAY_FALLBACK_ENABLED: "false"
    META_GATEWAY_BASE_URL: ""
    META_GATEWAY_TOKEN: ""
    ELEVENLABS_API_KEY: ""
    FACEBOOK_APP_ID: ""
    FACEBOOK_APP_SECRET: ""
    AUTH_PUBLIC_URL: http://localhost:${LOCAL_HTTP_PORT:-8080}
    VIRTUAL_DEVICE_BASE_URL: http://localhost:${LOCAL_HTTP_PORT:-8080}/v1
    VIRTUAL_DEVICE_BOOTSTRAP_ENABLED: "false"
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-realityos_local}:${POSTGRES_PASSWORD:?Configure .env.local}@postgres:5432/${POSTGRES_DB:-realityos_local}
    REDIS_URL: redis://redis:6379/0
  networks: [internal, egress]
  restart: unless-stopped
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realityos_local}
      POSTGRES_USER: ${POSTGRES_USER:-realityos_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure .env.local}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped
  api:
    <<: *backend
    ports: ["127.0.0.1:${LOCAL_HTTP_PORT:-8080}:8000"]
    command: [sh, -c, "python /scripts/local/prepare_database.py && python /scripts/local/bootstrap.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 20
  worker:
    <<: *backend
    command: [celery, -A, app.tasks.celery_app, worker, --loglevel=INFO, --concurrency=1]
    depends_on:
      api: {condition: service_healthy}

networks:
  internal: {internal: true}
  egress: {}
volumes:
  postgres_data: {}
  redis_data: {}
