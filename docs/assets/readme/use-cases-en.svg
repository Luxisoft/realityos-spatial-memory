<text x="42" y="236" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Patient portrait</text>
<text x="42" y="259" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">and observed fields</text>
<rect x="400" y="183" width="320" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="400" y="183" width="4" height="86" rx="2" fill="#0f766e"/>
