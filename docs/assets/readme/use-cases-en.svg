<path d="M726 226 L770 226" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="282" width="320" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="24" y="282" width="4" height="86" rx="2" fill="#2563eb"/>
<text x="42" y="310" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563eb">03  Social</text>
<text x="42" y="335" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Photo or question</text>
<text x="42" y="358" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">about an authorized profile</text>
<rect x="400" y="282" width="320" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="400" y="282" width="4" height="86" rx="2" fill="#0f766e"/>
<text x="418" y="310" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f766e">Profiles + search</text>
<text x="418" y="335" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Facial recognition</text>
<text x="418" y="358" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Authorized profile and media</text>
<rect x="776" y="282" width="320" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="776" y="282" width="4" height="86" rx="2" fill="#6d28d9"/>
<text x="794" y="310" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#6d28d9">Person context</text>
<text x="794" y="335" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Profile, posts and relationships</text>
<text x="794" y="358" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Permission-based visibility</text>
<path d="M350 325 L394 325" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M726 325 L770 325" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="381" width="320" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="24" y="381" width="4" height="86" rx="2" fill="#2563eb"/>
<text x="42" y="409" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563eb">04  Memory</text>
<text x="42" y="434" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Question about an object</text>
<text x="42" y="457" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">or a recorded memory</text>
<rect x="400" y="381" width="320" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="400" y="381" width="4" height="86" rx="2" fill="#0f766e"/>
<text x="418" y="409" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f766e">Muse Spark + SAM</text>
<text x="418" y="434" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Evidence retrieval</text>
<text x="418" y="457" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Text or voice query</text>
<rect x="776" y="381" width="320" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="776" y="381" width="4" height="86" rx="2" fill="#6d28d9"/>
<text x="794" y="409" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#6d28d9">Last observation</text>
<text x="794" y="434" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Highlighted photo or frame</text>
<text x="794" y="457" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Source, date and location</text>
