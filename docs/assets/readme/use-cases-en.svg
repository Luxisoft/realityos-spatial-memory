<path d="M726 127 L770 127" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="183" width="320" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="24" y="183" width="4" height="86" rx="2" fill="#2563eb"/>
