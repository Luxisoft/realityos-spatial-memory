<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
<title id="title">Four use cases, connected capabilities</title><desc id="desc">Input, processing and output for each use case.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1120" height="500" rx="12" fill="#f8fafc"/>
<text x="24" y="35" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#172554">Four use cases, connected capabilities</text>
<text x="24" y="69" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#475569">CONTEXT / INPUT</text>
<text x="400" y="69" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#475569">CAPABILITIES</text>
<text x="776" y="69" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#475569">OUTPUT</text>
<rect x="24" y="84" width="320" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="24" y="84" width="4" height="86" rx="2" fill="#2563eb"/>
<text x="42" y="112" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563eb">01  Police</text>
<text x="42" y="137" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Authorized person or evidence</text>
<text x="42" y="160" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">linked to a case</text>
<rect x="400" y="84" width="320" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="400" y="84" width="4" height="86" rx="2" fill="#0f766e"/>
<text x="418" y="112" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f766e">Biometrics + records</text>
<text x="418" y="137" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Enrolled portrait / search</text>
<text x="418" y="160" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Cases, events and attachments</text>
<rect x="776" y="84" width="320" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="776" y="84" width="4" height="86" rx="2" fill="#6d28d9"/>
<text x="794" y="112" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#6d28d9">Case context</text>
<text x="794" y="137" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Candidate for human review</text>
<text x="794" y="160" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Source, history and evidence</text>
