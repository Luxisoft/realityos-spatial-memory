<text x="418" y="236" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Record and prescription</text>
<text x="418" y="259" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Explicit field comparison</text>
<rect x="776" y="183" width="320" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="776" y="183" width="4" height="86" rx="2" fill="#6d28d9"/>
<text x="794" y="211" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#6d28d9">Professional review</text>
<text x="794" y="236" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Identity candidate + history</text>
<text x="794" y="259" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Mismatches and missing data</text>
