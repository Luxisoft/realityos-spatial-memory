<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="384" viewBox="0 0 1120 384" role="img" aria-labelledby="title desc">
<title id="title">Facial recognition: from portrait to context</title><desc id="desc">Explicit enrollment and isolated, workspace-scoped biometric search.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1120" height="384" rx="12" fill="#f8fafc"/>
<text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#172554">Facial recognition: from portrait to context</text>
<text x="24" y="67" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#475569">PREPARATION  ·  ADMIN / REGISTER</text>
<rect x="24" y="80" width="300" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="24" y="80" width="4" height="86" rx="2" fill="#2563eb"/>
<text x="42" y="108" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563eb">Authorized portrait</text>
<text x="42" y="133" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">One face per person record</text>
<text x="42" y="156" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Traceable biometric basis</text>
<rect x="400" y="80" width="300" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="400" y="80" width="4" height="86" rx="2" fill="#0f766e"/>
<text x="418" y="108" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f766e">InsightFace</text>
<text x="418" y="133" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Quality + embedding</text>
<rect x="776" y="80" width="320" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="776" y="80" width="4" height="86" rx="2" fill="#6d28d9"/>
<text x="794" y="108" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#6d28d9">Workspace index</text>
<text x="794" y="133" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">User enrollments and</text>
<text x="794" y="156" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">authorized person records</text>
<path d="M330 123 L394 123" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M706 123 L770 123" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="24" y="201" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#475569">SEARCH  ·  AUTHENTICATED USER</text>
<rect x="24" y="216" width="224" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="24" y="216" width="4" height="86" rx="2" fill="#2563eb"/>
<text x="42" y="244" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563eb">Photo / video</text>
<text x="42" y="269" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Ephemeral probe</text>
<text x="42" y="292" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">or authorized media</text>
<rect x="300" y="216" width="224" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="300" y="216" width="4" height="86" rx="2" fill="#0f766e"/>
<text x="318" y="244" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f766e">InsightFace</text>
<text x="318" y="269" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Detection + quality</text>
<text x="318" y="292" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Face embedding</text>
<rect x="576" y="216" width="224" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="576" y="216" width="4" height="86" rx="2" fill="#6d28d9"/>
<text x="594" y="244" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#6d28d9">Cosine similarity</text>
