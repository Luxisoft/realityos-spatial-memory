<text x="594" y="292" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Current authorization</text>
<rect x="852" y="216" width="244" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="852" y="216" width="4" height="86" rx="2" fill="#2563eb"/>
<text x="870" y="244" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563eb">Candidates</text>
<text x="870" y="269" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Profile or person record</text>
<text x="870" y="292" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Human confirmation</text>
<path d="M254 259 L294 259" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M530 259 L570 259" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M806 259 L846 259" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M936 166 V185 H688 V210" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="24" y="336" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#172554">matches → users    |    matches_records → person records</text>
<text x="24" y="365" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Similarity is not an identity probability. This module is separate from object registration and querying.</text>
