name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - meta-gateway/**
      - infrastructure/**
      - scripts/**
      - .github/workflows/deploy-production.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable GHCR tag to deploy for rollback; leave blank to build this commit.
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: realityos-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/luxisoft
  RELEASE_TAG: ${{ inputs.release_tag || github.sha }}
  META_GATEWAY_HOSTNAME: meta.luxisoft.com
  META_GATEWAY_PORT: "9088"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "backend[dev]" -e "meta-gateway[dev]"
      - run: ruff check backend tests meta-gateway gateway-tests
      - run: pytest -q tests gateway-tests

  build:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/realityos-backend:${{ env.RELEASE_TAG }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: meta-gateway/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/realityos-meta-gateway:${{ env.RELEASE_TAG }}

  deploy-gateway:
    needs: [verify, build]
    if: ${{ always() && needs.verify.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      FRONTEND_HOST: ${{ secrets.FRONTEND_SSH_HOST }}
      FRONTEND_USER: ${{ secrets.FRONTEND_SSH_USER }}
      FRONTEND_KEY: ${{ secrets.FRONTEND_SSH_PRIVATE_KEY }}
      FRONTEND_KNOWN_HOSTS: ${{ secrets.FRONTEND_SSH_KNOWN_HOSTS }}
      # The short-lived workflow token can pull the packages this workflow builds;
      # no long-lived GitHub Packages PAT needs to be stored on either server.
      GHCR_PULL_TOKEN: ${{ github.token }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      META_GATEWAY_TOKEN: ${{ secrets.META_GATEWAY_TOKEN }}
      ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
      GATEWAY_ALLOWED_CIDRS: ${{ secrets.GATEWAY_ALLOWED_CIDRS }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure trusted SSH connection
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$FRONTEND_KEY" > ~/.ssh/frontend
          printf '%s\n' "$FRONTEND_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Prepare gateway runtime artifacts
        run: |
          umask 077
          cat > .gateway-runtime.env <<EOF
          REALITYOS_GATEWAY_IMAGE=${REGISTRY}/realityos-meta-gateway:${RELEASE_TAG}
          META_GATEWAY_ENV_FILE=/opt/realityos-meta-gateway/runtime.env
          META_GATEWAY_PORT=${META_GATEWAY_PORT}
          MODEL_API_KEY=${MODEL_API_KEY}
          META_GATEWAY_TOKEN=${META_GATEWAY_TOKEN}
          META_API_BASE_URL=https://api.meta.ai/v1
          GATEWAY_MAX_REQUEST_BYTES=1073741824
          GATEWAY_TIMEOUT_SECONDS=300
          ACME_EMAIL=${ACME_EMAIL}
          EOF
          : > .gateway-allowlist.conf
          for cidr in ${GATEWAY_ALLOWED_CIDRS//,/ }; do
            printf 'allow %s;\n' "$cidr" >> .gateway-allowlist.conf
          done
          printf 'deny all;\n' >> .gateway-allowlist.conf
          : > .gateway-cloudflare-realip.conf
          {
            curl --fail --silent --show-error --retry 3 https://www.cloudflare.com/ips-v4
            curl --fail --silent --show-error --retry 3 https://www.cloudflare.com/ips-v6
          } | awk '
            /^[0-9A-Fa-f:.]+\/[0-9]+$/ { print "set_real_ip_from " $0 ";"; count++ }
            END { if (count == 0) exit 1 }
          ' > .gateway-cloudflare-realip.conf
          META_GATEWAY_HOSTNAME="$META_GATEWAY_HOSTNAME" META_GATEWAY_PORT="$META_GATEWAY_PORT" \
            bash scripts/deploy/render-meta-gateway-nginx.sh \
            infrastructure/gateway/nginx-meta.http.conf .gateway-http.conf
          META_GATEWAY_HOSTNAME="$META_GATEWAY_HOSTNAME" META_GATEWAY_PORT="$META_GATEWAY_PORT" \
            bash scripts/deploy/render-meta-gateway-nginx.sh \
            infrastructure/gateway/nginx-meta.https.conf .gateway-https.conf
      - name: Install and start gateway on FRONTEND
        run: |
          ssh -i ~/.ssh/frontend "$FRONTEND_USER@$FRONTEND_HOST" 'sudo install -d -m 0755 /opt/realityos-meta-gateway /var/www/realityos-meta-acme /etc/nginx/snippets'
          scp -i ~/.ssh/frontend infrastructure/gateway/docker-compose.yml "$FRONTEND_USER@$FRONTEND_HOST:/tmp/realityos-meta-compose.yml"
          scp -i ~/.ssh/frontend .gateway-runtime.env "$FRONTEND_USER@$FRONTEND_HOST:/tmp/realityos-meta-runtime.env"
          scp -i ~/.ssh/frontend .gateway-allowlist.conf "$FRONTEND_USER@$FRONTEND_HOST:/tmp/realityos-meta-allowlist.conf"
          scp -i ~/.ssh/frontend .gateway-cloudflare-realip.conf "$FRONTEND_USER@$FRONTEND_HOST:/tmp/realityos-meta-cloudflare-realip.conf"
          scp -i ~/.ssh/frontend .gateway-http.conf "$FRONTEND_USER@$FRONTEND_HOST:/tmp/realityos-meta-http.conf"
          scp -i ~/.ssh/frontend .gateway-https.conf "$FRONTEND_USER@$FRONTEND_HOST:/tmp/realityos-meta-https.conf"
          printf '%s' "$GHCR_PULL_TOKEN" | ssh -i ~/.ssh/frontend "$FRONTEND_USER@$FRONTEND_HOST" "sudo docker login ghcr.io --username '${{ github.actor }}' --password-stdin"
          ssh -i ~/.ssh/frontend "$FRONTEND_USER@$FRONTEND_HOST" '
            set -eu
            sudo install -m 0600 /tmp/realityos-meta-runtime.env /opt/realityos-meta-gateway/runtime.env
            sudo install -m 0644 /tmp/realityos-meta-compose.yml /opt/realityos-meta-gateway/docker-compose.yml
            sudo install -m 0644 /tmp/realityos-meta-allowlist.conf /etc/nginx/snippets/realityos-meta-allowlist.conf
            sudo install -m 0644 /tmp/realityos-meta-cloudflare-realip.conf /etc/nginx/snippets/realityos-meta-cloudflare-realip.conf
            sudo install -m 0644 /tmp/realityos-meta-http.conf /etc/nginx/conf.d/realityos-meta.conf
            acme_email=$(sudo sed -n "s/^ACME_EMAIL=//p" /opt/realityos-meta-gateway/runtime.env)
            gateway_token=$(sudo sed -n "s/^META_GATEWAY_TOKEN=//p" /opt/realityos-meta-gateway/runtime.env)
            sudo nginx -t
            sudo systemctl reload nginx
            command -v certbot >/dev/null 2>&1 || { sudo apt-get update; sudo apt-get install -y certbot; }
            if ! sudo test -f /etc/letsencrypt/live/meta.luxisoft.com/fullchain.pem; then
              sudo certbot certonly --webroot --webroot-path /var/www/realityos-meta-acme --non-interactive --agree-tos --email "$acme_email" --domains meta.luxisoft.com
            fi
            sudo install -m 0644 /tmp/realityos-meta-https.conf /etc/nginx/conf.d/realityos-meta.conf
            sudo nginx -t
            sudo systemctl reload nginx
            cd /opt/realityos-meta-gateway
            sudo docker compose --env-file runtime.env -f docker-compose.yml pull
            sudo docker compose --env-file runtime.env -f docker-compose.yml up -d --no-build
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:9088/healthz >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Meta gateway did not become healthy within 60 seconds" >&2
                sudo docker compose --env-file runtime.env -f docker-compose.yml logs --tail=100 >&2
                exit 1
              fi
              sleep 2
            done
            curl --fail --silent --show-error http://127.0.0.1:9088/v1/models -H "X-RealityOS-Gateway-Token: $gateway_token" | grep -q '"muse-spark-1.3"'
          '

  deploy-realityos:
    needs: deploy-gateway
    runs-on: ubuntu-latest
    environment: production
    env:
      REALITYOS_HOST: ${{ secrets.REALITYOS_SSH_HOST }}
      REALITYOS_USER: ${{ secrets.REALITYOS_SSH_USER }}
      REALITYOS_KEY: ${{ secrets.REALITYOS_SSH_PRIVATE_KEY }}
      REALITYOS_KNOWN_HOSTS: ${{ secrets.REALITYOS_SSH_KNOWN_HOSTS }}
      REALITYOS_DEPLOY_PATH: ${{ secrets.REALITYOS_DEPLOY_PATH }}
      GHCR_PULL_TOKEN: ${{ github.token }}
      META_GATEWAY_TOKEN: ${{ secrets.META_GATEWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure trusted SSH connection
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$REALITYOS_KEY" > ~/.ssh/realityos
          printf '%s\n' "$REALITYOS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Synchronize versioned deployment files
        run: |
          rsync -az \
            --exclude .env --exclude .git --exclude .venv --exclude node_modules --exclude dist \
            -e 'ssh -i ~/.ssh/realityos' \
            ./ "$REALITYOS_USER@$REALITYOS_HOST:$REALITYOS_DEPLOY_PATH/"
      - name: Activate gateway-backed API and worker
        run: |
          umask 077
          cat > .realityos-runtime.env <<EOF
          REALITYOS_BACKEND_IMAGE=${REGISTRY}/realityos-backend:${RELEASE_TAG}
          META_GATEWAY_BASE_URL=https://meta.luxisoft.com/v1
          META_GATEWAY_TOKEN=${META_GATEWAY_TOKEN}
          REALITYOS_DEPLOY_PATH=${REALITYOS_DEPLOY_PATH}
          EOF
          scp -i ~/.ssh/realityos .realityos-runtime.env "$REALITYOS_USER@$REALITYOS_HOST:/tmp/realityos-runtime.env"
          printf '%s' "$GHCR_PULL_TOKEN" | ssh -i ~/.ssh/realityos "$REALITYOS_USER@$REALITYOS_HOST" "sudo docker login ghcr.io --username '${{ github.actor }}' --password-stdin"
          ssh -i ~/.ssh/realityos "$REALITYOS_USER@$REALITYOS_HOST" '
            set -eu
            sudo install -d -m 0755 /opt/realityos
            sudo install -m 0600 /tmp/realityos-runtime.env /opt/realityos/runtime.env
            realityos_deploy_path=$(sudo sed -n "s/^REALITYOS_DEPLOY_PATH=//p" /opt/realityos/runtime.env)
            cd "$realityos_deploy_path"
            sh scripts/setup_runtime_dirs.sh
            sudo docker compose --env-file .env --env-file /opt/realityos/runtime.env -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.production.yml pull api worker
            sudo docker compose --env-file .env --env-file /opt/realityos/runtime.env -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.production.yml up -d --no-build api worker
            sudo docker compose --env-file .env --env-file /opt/realityos/runtime.env -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.production.yml exec -T api alembic upgrade head
            # Browser apps are deliberately built on the target from the same
            # synchronized commit. They do not receive the Meta API key.
            sudo docker compose --env-file .env --env-file /opt/realityos/runtime.env -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.production.yml build frontend display
            sudo docker compose --env-file .env --env-file /opt/realityos/runtime.env -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.production.yml up -d --no-build frontend display proxy
            sudo docker compose --env-file .env --env-file /opt/realityos/runtime.env -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.production.yml exec -T api python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health/ready\")"
          '
