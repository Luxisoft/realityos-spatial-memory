name: Publish workspace web
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: realityos-production
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.REALITYOS_SSH_HOST }}
      DEPLOY_USER: ${{ secrets.REALITYOS_SSH_USER }}
      DEPLOY_KEY: ${{ secrets.REALITYOS_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.REALITYOS_SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.REALITYOS_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run build
        env:
          VITE_API_URL: ""
      - name: Publish only frontend; preserve installed API and checkout
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/realityos
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf frontend-web.tar.gz -C frontend dist
          scp -i ~/.ssh/realityos frontend-web.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/realityos-web-${GITHUB_SHA}.tar.gz"
          scp -i ~/.ssh/realityos scripts/deploy/publish_frontend.py "$DEPLOY_USER@$DEPLOY_HOST:/tmp/realityos-publish-web-${GITHUB_SHA}.py"
          ssh -i ~/.ssh/realityos "$DEPLOY_USER@$DEPLOY_HOST" "sudo python3 /tmp/realityos-publish-web-${GITHUB_SHA}.py '${GITHUB_SHA}' '${DEPLOY_PATH}'"
