name: CI

on:
  pull_request:
  push:
    branches: [main, feat/realityos-initial-platform]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "backend[dev]"
      - run: ruff check backend tests
      - run: pytest -q tests
      - run: python -m pip check

  meta-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "meta-gateway[dev]"
      - run: ruff check meta-gateway gateway-tests
      - run: pytest -q gateway-tests
      - run: docker build --file meta-gateway/Dockerfile --tag realityos-meta-gateway:ci .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            display-webapp/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npm --prefix display-webapp ci
      - run: npm --prefix display-webapp run build
      - run: npm --prefix frontend audit --omit=dev
      - run: npm --prefix display-webapp audit --omit=dev
