name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Limit LFS checkout to local fixture media
        run: git config --global lfs.fetchinclude 'simulator/media/**'
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e "backend[dev]"
      - run: make docs-check
      - name: Validate local Bash console output
        run: bash tests/local/console.tests.sh
      - name: Verify generated scripts in the Postman runtime
        run: |
          npm install --prefix /tmp/postman-runtime --ignore-scripts --no-audit --no-fund newman@6.2.3
          NODE_PATH=/tmp/postman-runtime/node_modules make postman-runtime-check

  backend:
    runs-on: ubuntu-latest
    # Match production media encoding; Ubuntu ships a different FFmpeg major.
    container: python:3.13-slim-trixie
    steps:
      - name: Install checkout, LFS and integration-test dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y git git-lfs ffmpeg postgresql
          git config --global lfs.fetchinclude 'simulator/media/**'
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "backend[dev]"
      - run: python scripts/check_structure.py
      - run: ruff check backend tests
      - run: ruff check scripts/architecture_rules.py scripts/check_structure.py
      - run: ruff format --check backend/app/http backend/app/providers backend/app/processing backend/app/social_features backend/app/routes.py backend/app/meta.py backend/app/services.py backend/app/social.py tests/social tests/test_architecture_contract.py tests/conftest.py scripts/check_structure.py
      - run: ruff format --check backend/app/runtime backend/app/local backend/app/config.py backend/app/db.py tests/test_architecture_boundaries.py tests/test_runtime_profiles.py tests/test_schema_bootstrap.py tests/test_local_upgrade_safety.py tests/postgres_support.py scripts/architecture_rules.py
      - name: Test with disposable PostgreSQL as an unprivileged user
        run: |
          mkdir -p .runtime
          chown postgres:postgres .runtime
          runuser -u postgres -- python -m pytest -q tests --basetemp=.runtime/ci-tests -o cache_dir=.runtime/pytest-cache
      - run: python -m pip check

  meta-gateway:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "meta-gateway[dev]"
      - run: ruff check meta-gateway gateway-tests
      - run: pytest -q gateway-tests
      - run: docker build --file meta-gateway/Dockerfile --tag realityos-meta-gateway:ci .

  windows-local-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows local scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem scripts/local/*.ps1
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          ./tests/local/powershell.tests.ps1
      - name: Validate Windows PowerShell 5.1 compatibility
        shell: powershell
        run: ./tests/local/powershell.tests.ps1

  android:
    runs-on: ubuntu-latest
    # A hosted emulator can occasionally stall while its system image is
    # provisioned. Keep the hardware-free DAT verification bounded so it
    # cannot hold the entire CI workflow indefinitely.
    timeout-minutes: 25
    env:
      ANDROID_FACEBOOK_APP_ID: ${{ secrets.ANDROID_FACEBOOK_APP_ID }}
      ANDROID_FACEBOOK_CLIENT_TOKEN: ${{ secrets.ANDROID_FACEBOOK_CLIENT_TOKEN }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # The hosted runner already includes cmdline-tools.  Invoking sdkmanager
      # directly avoids setup-android's obsolete `tools` package request.
      - run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build isolated localhost Android variant
        working-directory: android
        run: |
          ./gradlew -PlocalDevelopment=true -PrealityosApiBaseUrl=http://localhost:8080/v1 :app:testDebugUnitTest --tests com.luxisoft.realityos.LocalAccessPolicyTest :app:assembleDebug
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.luxisoft.realityos.local'"
      - name: Build Debug and Release Android variants
        working-directory: android
        run: |
          ./gradlew :app:ktlintCheck :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:compileDebugAndroidTestKotlin
          ! unzip -p app/build/outputs/apk/release/app-release-unsigned.apk 'classes*.dex' |
            strings |
            grep -qi 'com/meta/wearable/dat/mockdevice'
      # The debug APK is deliberately retained so a reviewer can install the
      # exact artifact that passed the build. Release signing stays outside
      # GitHub until a production signing key is configured as a secret.
      - name: Publish installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: realityos-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      # GitHub runners expose KVM but the default runner user may not have
      # access. Without this, the emulator silently falls back to TCG and a
      # cold boot can take 15+ minutes.
      - name: Enable KVM for the emulator
        run: |
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm
      # Executes Meta's Mock Device Kit on a disposable Android emulator; this
      # is a simulation, never a substitute for physical-glasses validation.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back emulated -camera-front emulated
          script: |
            ./android/gradlew --project-dir android :app:connectedDebugAndroidTest --stacktrace --info || { adb logcat -d -v brief | tail -n 1000; exit 1; }
      - name: Retain Android regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realityos-android-test-reports
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
            android/app/build/outputs/account-design/
            android/app/build/outputs/entry-design/
          if-no-files-found: ignore
          retention-days: 7
